<!DOCTYPE html>
<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FrigoMalin</title>
  <style>
    :root { --bg: #ffffff; --text: #1f1f1f; --muted: #444746; }

      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text); font-family: Roboto, "Segoe UI", system-ui, sans-serif;
      text-align: center; padding: 16px;
    }
    h1 { font-weight: 400; margin: 12px 0 4px; }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>

    <div style="font-size: 48px">🥕🥛🍎</div>

</html>
